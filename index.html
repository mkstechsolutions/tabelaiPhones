<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela iPhones MKS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1 class="brand-name">MKS Tech Solutions</h1>
            <p>CONECTANDO VOCÊ <span onclick="abrirLoginAdm()" style="cursor: default;">AO</span> FUTURO</p>
        </header>

        <input type="text" id="inputPesquisa" class="search-box" placeholder="Buscar modelo...">

        <div class="tabs">
            <button onclick="mudarAba('novos')" id="btn-novos" class="tab-btn active">NOVOS</button>
            <button onclick="mudarAba('seminovos')" id="btn-seminovos" class="tab-btn">SEMINOVOS</button>
        </div>

        <div id="lista-produtos"></div>

        <footer>
            <p>© 2026 MKS Tech Solutions. Todos os direitos reservados.</p>
        </footer>
    </div>

    <div id="modal-adm" class="modal">
        <div class="modal-content">
            <span class="close" onclick="fecharAdm()">&times;</span>
            <h3>Painel do Administrador</h3>
            <div id="form-cadastro">
                <input type="text" id="add-modelo" placeholder="Modelo (Ex: iPhone 15)" class="search-box">
                <input type="text" id="add-capacidade" placeholder="Armazenamento (Ex: 128GB)" class="search-box">
                <input type="text" id="add-saude" placeholder="Saúde Bateria (Ex: 100%)" class="search-box">
                <input type="text" id="add-preco" placeholder="Valor (Ex: 4.500)" class="search-box">
                <textarea id="add-desc" placeholder="Descrição do aparelho..." class="search-box"></textarea>
                
                <label style="font-size: 0.8rem; color: #a78bfa;">Tipo de Aparelho:</label>
                <select id="add-tipo" class="search-box">
                    <option value="novos">Novo</option>
                    <option value="seminovos">Seminovo</option>
                </select>
                
                <button onclick="salvarProduto()" id="btn-salvar" class="btn-whats">Salvar na Planilha</button>
            </div>
        </div>
    </div>

    <a href="https://mkstechsolutions.github.io/calculadoraiPhones/" id="btn-calc" class="floating-btn calc" title="Calculadora">
        <span><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-calculator-fill" viewBox="0 0 16 16">
            <path d="M2 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2zm2 .5v2a.5.5 0 0 0 .5.5h7a.5.5 0 0 0 .5-.5v-2a.5.5 0 0 0-.5-.5h-7a.5.5 0 0 0-.5.5m0 4v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5M4.5 9a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5zM4 12.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5M7.5 6a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5zM7 9.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5m.5 2.5a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5zM10 6.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5m.5 2.5a.5.5 0 0 0-.5.5v4a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-4a.5.5 0 0 0-.5-.5z"/>
        </svg></span>
    </a>
    <a href="https://mkstechsolutions.github.io/chatBotMKS/" target="_blank" class="floating-btn support" title="Dúvidas?">
        <span>💬</span>
    </a>

    <script src="script.js"></script>
</body>
</html>
